<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#eef4fb;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#0f1b2d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #dfe7f1;border-radius:22px;padding:32px">
          <tr><td>
            <p style="margin:0 0 12px;font-family:Poppins,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:-0.01em;color:#0e6bb8">smartclin</p>
            <h1 style="margin:0 0 16px;font-size:22px;line-height:28px">Seu link de acesso</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#455469">Use o botão abaixo para entrar na sua conta {{ .Email }}. Se você recebeu um convite para uma clínica, ele aparecerá em seguida. O link vale por 1 hora e funciona uma vez.</p>
            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#0e6bb8;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px">Entrar</a>
            <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#455469">Se você não pediu este link, ignore este e-mail: ninguém entra na sua conta sem ele.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
